name: Build si deploy pe Kubernetes

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Descarca codul
        uses: actions/checkout@v4

      - name: Login la Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

- name: Build si push cu tag unic
        shell: cmd
        run: |
          docker build -t vtacic/site-vasile:${{ github.sha }} .
          docker push vtacic/site-vasile:${{ github.sha }}

      - name: Actualizeaza Kubernetes
        shell: cmd
        run: |
          kubectl set image deployment/site-deployment site=vtacic/site-vasile:${{ github.sha }}